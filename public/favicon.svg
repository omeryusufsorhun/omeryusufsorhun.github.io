  <circle cx="16" cy="20.5" r="6.4" fill="none" stroke="#00FF9C" stroke-width="3.2"/>
  <circle cx="12.2" cy="8.6" r="2" fill="#00FF9C"/>
  <circle cx="19.8" cy="8.6" r="2" fill="#00FF9C"/>
</svg>
